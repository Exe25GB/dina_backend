spring.application.name=dina_backend
server.port=8080

# Perfil por defecto: h2 (base en archivo ./data, no requiere instalar nada).
# Para MySQL: SPRING_PROFILES_ACTIVE=mysql (ver application-mysql.properties)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jackson.time-zone=America/Santiago

# Fotos de perfil (la app las envía de ~100 KB; esto es solo el tope)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ── Reglas de negocio de DINA ─────────────────────────────────────────
# Zona horaria de la sede (para saber qué bloques ya pasaron)
dina.zona-horaria=America/Santiago
# Dominios institucionales permitidos para iniciar sesión
dina.dominios-permitidos=duocuc.cl,profesor.duoc.cl
# Máximo de bloques de 1 hora que se pueden juntar en una solicitud
dina.solicitudes.max-bloques=4
# Con cuántos días de anticipación se puede solicitar como máximo
dina.solicitudes.max-dias-anticipacion=30
# Duración de la sesión (token) en días
dina.sesion.dias=7
# Contraseña de los usuarios de prueba creados al iniciar (cámbiala con la variable DINA_SEED_PASSWORD)
dina.seed.password-inicial=${DINA_SEED_PASSWORD:duoc1234}
